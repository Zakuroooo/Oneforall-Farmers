# Postgres for local development. OWNER: R1.
# Port 5433 on purpose — 5432 is usually already taken by a local Postgres install,
# and "why does the app connect to the wrong database" costs an hour to find.
services:
  postgres:
    image: postgres:16-alpine
    container_name: mandi-pg
    restart: unless-stopped
    environment:
      POSTGRES_USER: mandi
      POSTGRES_PASSWORD: mandi_dev_only
      POSTGRES_DB: mandi
    ports:
      - '5433:5432'
    volumes:
      - mandi-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U mandi -d mandi']
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  mandi-pgdata:
